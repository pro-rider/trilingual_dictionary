name: contracts

# The Python and Dart sides share two committed golden-vector files. If either
# implementation drifts, this fails — no silent divergence, no skipped check.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Golden vectors match the implementation
        run: python tools/check_translation_golden.py
      - name: Test suite
        run: python -m pytest -q
      - name: Encoding detector proves it bites (PROTOCOL.md rule 3)
        run: python tools/check_encoding.py --selftest
      - name: Encoding gate on the built asset (rule 9)
        if: ${{ hashFiles('backend/data/build/dictionary.sqlite') != '' }}
        run: python tools/check_encoding.py --db data/build/dictionary.sqlite
      - name: FTS exact-ID gate on the built asset
        if: ${{ hashFiles('backend/data/build/dictionary.sqlite') != '' }}
        run: python tools/validate_fts.py --db data/build/dictionary.sqlite

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Test suite (reads the same shared golden vectors)
        run: flutter test
