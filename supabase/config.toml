# Local Supabase stack, used by CI (`supabase start` + `supabase db reset`) and
# by anyone reproducing the auth checks on their own machine.
#
# Public e-mail sign-up is OFF, matching the app's design: the mobile client
# never holds the anon key and never talks to GoTrue directly — FastAPI creates
# users through the admin API and signs them in server-side.

project_id = "trilingual_dictionary"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
# Capture-only SMTP for the local stack (the CLI's successor to [inbucket]).
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The e-mail provider must stay enabled for password sign-in (FastAPI calls
# GoTrue with the service role); the global `enable_signup = false` above is
# what refuses public self-service registration. Setting this to false disables
# the provider outright ("email_provider_disabled").
enable_signup = true
# Accounts are created by the admin API with email_confirm=true, so the local
# stack must not require a confirmation link before a password sign-in works.
enable_confirmations = false

[auth.sms]
enable_signup = false
