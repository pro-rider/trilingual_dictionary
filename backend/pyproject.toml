[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trilingual-dictionary-backend"
version = "0.1.0"
description = "FastAPI backend for the Trilingual Dictionary app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
