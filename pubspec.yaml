name: trilingual_dictionary
description: "Trilingual Dictionary — search English or Chinese, get meanings and aligned example sentences in English, Chinese and Nepali."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.5
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/thumbs/
    - assets/strokes/
